spring.application.name=garagem-veiculos-hardware

# Configuracao do servidor HTTP embutido (Tomcat) parametrizada por perfil de hardware
server.port=8080
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
server.tomcat.threads.min-spare=${TOMCAT_MIN_THREADS:4}
server.tomcat.accept-count=100

# Persistencia em disco local no conteiner (exercita I/O de armazenamento e pool HikariCP)
spring.datasource.url=jdbc:h2:file:/app/data/garagemdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dimensionamento dinamico do pool HikariCP conforme cota de CPU/RAM
spring.datasource.hikari.pool-name=GaragemHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Parametros de dominio da garagem
garagem.capacidade-total=${GARAGEM_CAPACIDADE:500}
garagem.seed-enabled=${GARAGEM_SEED:true}
